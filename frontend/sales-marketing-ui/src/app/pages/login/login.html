<main class="login-page"><section class="login-intro"><div class="brand"><span class="brand-mark">S</span><strong>Sales<span>Marketing</span></strong></div><div><p class="eyebrow">Admin workspace</p><h1>Make every relationship count.</h1><p class="intro-copy">Manage your sales force, teams and targets from one focused workspace.</p></div><div class="intro-stat"><strong>01</strong><span>Secure operations<br>for your entire team</span></div></section><section class="login-card"><p class="eyebrow">Welcome back</p><h2>Sign in</h2><p class="muted">Use your administrator credentials to continue.</p><form (ngSubmit)="submit()"><label for="username">Username</label><input id="username" name="username" [(ngModel)]="username" autocomplete="username" placeholder="Enter username"><label for="password">Password</label><input id="password" name="password" [(ngModel)]="password" type="password" autocomplete="current-password" placeholder="Enter password">@if (error) {<div class="error">{{ error }}</div>}<button ejs-button cssClass="e-primary e-block" type="submit" [disabled]="auth.loading()">{{ auth.loading() ? 'Signing in…' : 'Sign in' }}</button></form></section></main>
